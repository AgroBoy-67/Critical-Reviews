<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PainelADM</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/paineldoadm.css">
</head>
<body>
    <header>
        <h1>Olá administrador, veja as consultas disponíveis abaixo.</h1>
        <p>Mais opções serão adicionadas</p>
        <button id="logoutButtonSairAdmin">Sair do painel</button>
    </header>
    <main>
        <section>
            <div id="cadastrados">
                <p>Total de usuários:</p>
            </div>
        </section>
        <section class="consultas-adm">
            <div>
                <form class="botoes-admin">

                        <button data-consulta="todos" type="button">Todos os usuários</button>

                        <button data-consulta="id" type="button">Usuários por ID</button>

                        <button data-consulta="idDesc" type="button">Usuários por ID Decresc.</button>

                        <button data-consulta="nome" type="button">Usuários por nome A - Z</button>

                        <button data-consulta="nomeDesc" type="button">Usuários por nome Z - A</button>

                        <button data-consulta="contar" type="button">Contar usuários</button>

                </form>
            </div>
            <div>
                <div id="exibirConsulta"></div>
            </div>
        </section>
        <section>
            
        </section>
    </main>
    <script src="js/paineladoadm.js"></script>
</body>
</html>
