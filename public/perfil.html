<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/perfil.css">
</head>
<body>
    <video autoplay muted loop playsinline id="video-fundo">
        <source src="css/fotos/CR.mp4" type="video/mp4">
    </video>
    <header class="header">
        <div class="divLogo">
            <a href="inicio.html"><img src="css/fotos/logo.png" alt="Logo" width="65px" class="logo"></a>
        </div>
        <nav class="nav">
            <div>
                <a href="inicio.html" class="aDoNav" id="logoTXT">Inicio</a>
                <a href="inicio.html"><img src="css/fotos/inicio.png" width="65px" id="logoIMG"></a>
            </div>
            <div>
                <a href="avaliar.html" class="aDoNav" id="avaliarTXT">Avaliar</a>
                <a href="avaliar.html"><img src="css/fotos/avaliar.png" width="65px" id="avaliarIMG"></a>
            </div>
        </nav>
        <a href="perfil.html" class="perfil-header">
            <div class="divFoto">
                <img src="css/fotos/semFoto.png" alt="Sem foto">
                <p>Sem nome</p>
            </div>
        </a>
        <div class="divConfig">
            <a href="config.html" class="aDoNav"><img src="css/fotos/config.png" alt="Configurações" width="40px" class="engrenagem"></a>
        </div>
    </header>
    <main class="main-perfil">
        <form class="sec-perfil1">
            <div class="perfil-p1">
                <div>
                    <img src="css/fotos/semFoto.png" alt="Sem foto" width="300px">
                </div>
                <div>
                    <button>Mudar foto</button>
                </div>
            </div>
            <div class="perfil-p2">
                <div>
                    <p>Sem nome</p>
                </div>
                <br>
                <div>
                    <form class="mudar-nome">
                        <input type="text">
                        <button>Mudar nome</button>
                    </form>
                </div>
            </div>  
        </form>
        <div class="sairConta">
            <button id="logoutButtonSair">Sair da conta</button>
        </div>
    </main>
    <script src="js/explorar.js"></script>
</body>
</html>
