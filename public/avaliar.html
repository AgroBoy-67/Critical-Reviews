<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliar</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/avaliar.css">
</head>
<body>
    <header class="header">
        <div>
            <a href="inicio.html"><img src="css/fotos/logo.png" alt="Logo" width="65px" class="logo"></a>
        </div>
        <nav class="nav">
            <a href="inicio.html" class="aDoNav">Inicio</a>
            <a href="avaliar.html" class="aDoNav">Avaliar</a>
        </nav>
        <a href="perfil.html" class="perfil-header">
            <div class="divFoto">
                <img src="css/fotos/semFoto.png" alt="Sem foto" width="40px">
                <p>Sem nome</p>
            </div>
        </a>
        <div class="divConfig">
            <a href="config.html" class="aDoNav"><img src="css/fotos/config.png" alt="Configurações" width="40px" class="engrenagem"></a>
        </div>
    </header>
    <main>
        <section class="sec-avaliar">
            <div class="header-avaliar">
                <h1>Envie sua avaliação</h1>
            </div>
            <form id="formEnviar">
                <div class="body-avaliar">
                    <div class="avaliar-part1">
                        <div class="imagemPreview-avaliar">
                            <input type="file" id="imagem" accept="image/*" hidden>
                            <label for="imagem" id="escolherImagem">Enviar foto</label>
                            <p id="textoVazio">Nenhuma imagem selecionada</p>
                            <img id="preview" src="" alt="Pré-visualização da imagem" style="display: none; max-width: 200px;">
                        </div>
                    </div>
                    <div class="avaliar-part2">
                        <div class="input-box">
                            <label for="nomeDaCoisa">Nome do item que quer avaliar:</label>
                            <input type="text" name="nome-item" id="nomeDaCoisa" placeholder="Nome do item..." required>
                        </div>
                        <div class="input-box">
                            <label for="categoria">Classifique seu item:</label>
                            <select id="categoria" required>
                                <option value="" selected disabled>- Selecione -</option>
                                <option value="pessoa">Uma pessoa</option>
                                <option value="lugar">Um lugar</option>
                                <option value="situacao">Uma situação</option>
                                <option value="evento">Um evento</option>
                                <option value="objeto">Um objeto</option>
                                <option value="midia">Uma peça de mídia ou entretenimento</option>
                            </select>
                        </div>
                        <div class="input-box">
                            <label for="avaliacao">Descreva sua avaliação:</label>
                            <textarea name="descricao" id="avaliacao" rows="4" placeholder="Descreva o item..." required></textarea>
                        </div>
                        <div>
                            <h2>Quantas estrelas o item merece?</h2>
                            <div class="estrelas-box">
                                <div>
                                    <button class="estrela" type="button" onclick="escolhaEstrelas(1)">
                                        <img src="css/fotos/estrela vazia.png" id="estrelaVazia1" alt="Estrela vazia">
                                        <img src="css/fotos/estrela cheia.png" id="estrelaCheia1" alt="Estrela cheia" style="display: none;">
                                    </button>
                                </div>
                                <div>
                                    <button class="estrela" type="button" onclick="escolhaEstrelas(2)">
                                        <img src="css/fotos/estrela vazia.png" id="estrelaVazia2" alt="Estrela vazia">
                                        <img src="css/fotos/estrela cheia.png" id="estrelaCheia2" alt="Estrela cheia" style="display: none;">
                                    </button>
                                </div>
                                <div>
                                    <button class="estrela" type="button" onclick="escolhaEstrelas(3)">
                                        <img src="css/fotos/estrela vazia.png" id="estrelaVazia3" alt="Estrela vazia">
                                        <img src="css/fotos/estrela cheia.png" id="estrelaCheia3" alt="Estrela cheia" style="display: none;">
                                    </button>
                                </div>
                                <div>
                                    <button class="estrela" type="button" onclick="escolhaEstrelas(4)">
                                        <img src="css/fotos/estrela vazia.png" id="estrelaVazia4" alt="Estrela vazia">
                                        <img src="css/fotos/estrela cheia.png" id="estrelaCheia4" alt="Estrela cheia" style="display: none;">
                                    </button>
                                </div>
                                <div>
                                    <button class="estrela" type="button" onclick="escolhaEstrelas(5)">
                                        <img src="css/fotos/estrela vazia.png" id="estrelaVazia5" alt="Estrela vazia">
                                        <img src="css/fotos/estrela cheia.png" id="estrelaCheia5" alt="Estrela cheia" style="display: none;">
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div>
                            <button class="enviar-avaliar" type="submit">Enviar review</button>
                        </div>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <script src="js/avaliar.js"></script>
</body>
</html>
