<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
     <header>
        <img src="css/fotos/logo.png" alt="Logo">
        <h1></h1>
     </header>

     <main>
        <section id="formLoginSec">
            <h2 style="text-align: center;">Entre no Critical Reviews</h2>
            <br>
            <form id="formLogin">
                <label for="email">Email</label>
                <input type="email" required placeholder="digite o seu e-mail" id="email">

                <label for="senha">Senha</label>
                <input type="password" required placeholder="digite a sua senha" id="senha">
                <button type="submit">Entrar</button>
            </form>
            <a href="cadastro.html"  class="btnCadastro">Criar Conta</a> 
        </section>
     </main>
     <footer style="text-align: center;">&copy; Critical Review todos os direitos reservados;</footer>
     <script src="js/index.js"></script>
</body>
</html>
