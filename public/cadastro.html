<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
         <header>
        <img src="css/fotos/logo.png" alt="Logo">
        <h1></h1>
     </header>
     <main>
        <section id="formCadasSec">
            <h2 style="text-align: center;">Crie uma conta</h2>
            <br>
            <form id="formCadas">
                <label for="nome">Nome</label>
                <input type="text" required placeholder="digite o seu nome de usuário" id="nome">

                <label for="emailC">Email</label>
                <input type="email" required placeholder="digite o seu e-mail" id="emailC">

                <label for="senhaC">Senha</label>
                <input type="password" required placeholder="digite a sua senha" id="senhaC">

                <label for="senhaC2">Repita a Senha</label>
                <input type="password" required placeholder="digite a sua senha novamente" id="senhaC2">

                <button type="submit">Criar</button>
            </form>
            <a href="index.html"  class="btnCadastro">Já tenho uma conta</a> 
        </section>
     </main>
     <footer style="text-align: center;">&copy; Critical Review todos os direitos reservados;</footer>
     <script src="js/index.js"></script>
</body>
</html>
