<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <!-- AOS -->
    <link rel="stylesheet"
        href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</head>

<body>

    <div class="LCBox">

        <h1  style="font-family: fTitulos; color: rgb(255, 255, 143)" class="titulosLogin">Cadastro</h1>

        <form id="FormCadastro" class="FormLC">
            <label class="labelForm2">Nome: </label>
            <input id="Nome" type="text" placeholder="Nome" class="inputForm">
            <label class="labelForm2">E-mail: </label>
            <input id="EmailC" type="email" placeholder="E-mail" class="inputForm">
            <label class="labelForm2">Senha: </label>
            <input id="SenhaC" type="password" placeholder="Senha" class="inputForm">
            <label class="labelForm2">Cofirme sua senha: </label>
            <input id="SenhaCC" type="password" placeholder="Confirme sua senha" class="inputForm">
            <button type="submit" class="botoes"> Cadastrar </button>

        </form>

        <p> Já possui uma conta? </p><a href="index.html" class="aDeNavegacao">Entrar</a> 

    </div>

    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="script.js"></script>
</body>

</html>
